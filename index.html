<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة التقديم الإلكتروني</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 40px auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #007bff; margin-bottom: 25px; }
        .menu-btn { display: block; width: 100%; padding: 15px; margin: 10px 0; background: #007bff; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; text-align: center; }
        .form-section { display: none; margin-top: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 12px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
        .submit-btn { background: #28a745; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .back-btn { background: #6c757d; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; margin-bottom: 15px; }
    </style>
</head>
<body>
<div class="container">
    <h2>اختر الخدمة المطلوبة للبدء</h2>
    <div id="main-menu">
        <button class="menu-btn" onclick="selectService('التقديم على الاستمارة')">📝 التقديم على الاستمارة</button>
        <button class="menu-btn" onclick="selectService('الاستعلام عن الطلب')">🔍 الاستعلام عن الطلب</button>
    </div>
    <div id="form-section" class="form-section">
        <button class="back-btn" onclick="goBack()">← العودة</button>
        <h3 id="form-title" style="color: #333;"></h3>
        <form onsubmit="alert('تم إرسال طلبك بنجاح!'); location.reload();">
            <div class="form-group"><label>الاسم الكامل:</label><input type="text" required></div>
            <div class="form-group"><label>رقم الهاتف:</label><input type="tel" required></div>
            <button type="submit" class="submit-btn">إرسال الطلب</button>
        </form>
    </div>
</div>
<script>
    function selectService(name) {
        document.getElementById('main-menu').style.display = 'none';
        document.getElementById('form-section').style.display = 'block';
        document.getElementById('form-title').innerText = "نموذج: " + name;
    }
    function goBack() {
        document.getElementById('form-section').style.display = 'none';
        document.getElementById('main-menu').style.display = 'block';
    }
</script>
</body>
</html>
